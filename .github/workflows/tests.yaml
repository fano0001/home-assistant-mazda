name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Same commands and pins as local runs (ruff and PHACC match the targeted
      # HA release, 2026.7.0). No lockfile on purpose: it would pull HA's whole
      # dependency tree into Dependabot for test-only packages.
      - name: Lint
        run: uvx ruff@0.15.17 check custom_components/mazda_cs tests
      - name: Pytest
        run: >-
          uv run --no-project --python 3.14
          --with pytest-homeassistant-custom-component==0.13.344
          --with "protobuf>=6.30.2"
          pytest tests/

  # The minimum in hacs.json: HA 2025.12.0 (PHACC 0.13.298). Change both together.
  tests-minimum-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # --exclude-newer keeps dependencies at what that release ran with. Newer
      # ones no longer work with it (pycares 5 breaks its aiodns 3.5.0).
      - name: Pytest
        run: >-
          uv run --no-project --python 3.13 --exclude-newer 2025-12-08
          --with pytest-homeassistant-custom-component==0.13.298
          --with "protobuf>=6.30.2"
          pytest tests/
