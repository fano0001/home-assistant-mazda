name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HACS validation
        # Tracks main on purpose: HACS recommends it, and its last tagged
        # release (22.5.0) is from 2022.
        uses: "hacs/action@main"
        with:
          category: "integration"
