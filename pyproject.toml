[tool.pytest.ini_options]
# pytest-homeassistant-custom-component ships async autouse fixtures, so
# pytest-asyncio must run in "auto" mode (matches Home Assistant core's config).
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".git", "custom_components"]

[tool.ruff]
# protoc output ("DO NOT EDIT"); regenerate instead of editing. Its imports of
# sibling *_pb2 modules register descriptors and only look unused.
extend-exclude = ["custom_components/mazda_cs/pymazda/push/_proto"]
